# Docker Compose for OrzPlayer Service (CAS 版)
#
#   Build images: docker compose build
#      Start app: docker compose up app
# Start database: docker compose up db
# Run migrations: docker compose run migrate
#  Import music: docker compose run --rm scan
#       Stop all: docker compose down (add -v to wipe db)

volumes:
  db_data:
  cas_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_HOST: db
  DATABASE_NAME: vapor_database
  DATABASE_USERNAME: vapor_username
  DATABASE_PASSWORD: vapor_password
  CAS_ROOT: /data/music

services:
  cas-init:
    image: music-service:latest
    build:
      context: .
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /data/music"]
    volumes:
      - cas_data:/data/music
    restart: "no"

  app:
    image: music-service:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
      cas-init:
        condition: service_completed_successfully
    ports:
      - '8080:8080'
    volumes:
      - cas_data:/data/music
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]

  migrate:
    image: music-service:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0

  scan:
    image: music-service:latest
    build:
      context: .
    environment:
      <<: *shared_environment
      # 源目录：挂载到容器内 /sources/ 下
      # docker compose run --rm scan \
      #   serve --env production --hostname 0.0.0.0 --port 8081
      # 然后用 curl 触发扫描:
      # curl -X POST http://localhost:8081/api/scan \
      #   -H "Content-Type: application/json" \
      #   -d '{"sources": ["/sources/keygen"]}'
    depends_on:
      db:
        condition: service_healthy
      cas-init:
        condition: service_completed_successfully
    volumes:
      - cas_data:/data/music
      - ${KEYGEN_DIR:-./Resources/Public/keygenmusic}:/sources/keygen:ro
    ports:
      - '8081:8081'
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8081"]
    deploy:
      replicas: 0

  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_database
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor_username -d vapor_database"]
      interval: 5s
      timeout: 5s
      retries: 5
