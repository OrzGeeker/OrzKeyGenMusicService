name: OrzAudioCore

on:
  push:
    paths: ["Sources/OrzAudioKitCXX/**", "Sources/OrzAudioKit/**", "SDK/**", "Tests/SDK/**", "decoder-manifest.json", "audio-core-sdk.lock.json", "CMakeLists.txt", "CMakePresets.json", "script/generate-decoder-manifest.mjs", "script/fetch-decoder-sources.sh", "script/build-native-libs.sh", "script/update-audio-core-server.sh", "script/verify-audio-core-server-sdk.sh", "script/verify-audio-core-pcm.sh", "script/compare-audio-core-pcm.mjs", ".github/workflows/orz-audio-core.yml"]
  pull_request:
    paths: ["Sources/OrzAudioKitCXX/**", "Sources/OrzAudioKit/**", "SDK/**", "Tests/SDK/**", "decoder-manifest.json", "audio-core-sdk.lock.json", "CMakeLists.txt", "CMakePresets.json", "script/generate-decoder-manifest.mjs", "script/fetch-decoder-sources.sh", "script/build-native-libs.sh", "script/update-audio-core-server.sh", "script/verify-audio-core-server-sdk.sh", "script/verify-audio-core-pcm.sh", "script/compare-audio-core-pcm.mjs", ".github/workflows/orz-audio-core.yml"]

jobs:
  abi-lite:
    strategy:
      matrix: {os: [macos-15, ubuntu-24.04]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node script/generate-decoder-manifest.mjs --check
      - run: cmake --preset builtin-lite
      - run: cmake --build --preset builtin-lite
      - run: ctest --test-dir .cmake-build/builtin-lite --output-on-failure
      - run: cmake --install .cmake-build/builtin-lite --prefix "$RUNNER_TEMP/orzcore"
      - run: cmake -S Tests/SDK/consumer -B "$RUNNER_TEMP/consumer" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/orzcore"
      - run: cmake --build "$RUNNER_TEMP/consumer"
      - run: "$RUNNER_TEMP/consumer/consumer"

  sanitizer-lite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B .cmake-build/sanitizer-lite
          -DORZ_PROFILE=builtin-lite -DORZ_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build .cmake-build/sanitizer-lite
      - run: ctest --test-dir .cmake-build/sanitizer-lite --output-on-failure

  web-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - working-directory: SDK/Web
        run: npm install
      - working-directory: SDK/Web
        run: npm run build
      - run: node --test Tests/Browser/*.test.mjs

  released-server-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-decoder-sources-${{ runner.os }}-${{ hashFiles('script/fetch-decoder-sources.sh') }}
      - run: ./script/update-audio-core-server.sh
      - run: ./script/verify-audio-core-server-sdk.sh
      - name: Link Swift binding against released SDK
        run: swift run OrzAudioCoreSmoke
        env:
          ORZ_AUDIO_CORE_EXTERNAL: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/.audio-core-sdk/server/native/lib
      - run: ./script/fetch-decoder-sources.sh
      - run: ./script/build-native-libs.sh --strict
      - run: cmake --preset linux-x86_64
      - run: cmake --build --preset linux-x86_64 --parallel
      - run: ./script/verify-audio-core-pcm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pcm-conformance
          path: .audio-core-sdk/pcm-conformance.json
